<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>진심 입시정보</title>
<meta name="description" content="EBS 입시정보 대표강사가 전하는 입시 나침반 — 주간 레터·전형 분석·시사 이슈 아카이브">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1a1a1a;
    --paper:#ffffff;
    --soft:#f6f5f1;
    --rule:#e2e0da;
    --accent:#8f1d1d;     /* 신문 마스트헤드 레드 (단색 포인트) */
    --gray:#6f6c66;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Pretendard',-apple-system,sans-serif;background:var(--paper);
    color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased;}
  .serif{font-family:'Nanum Myeongjo',serif;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:880px;margin:0 auto;padding:0 22px;}

  /* ===== 마스트헤드 (신문 1면) ===== */
  .util{display:flex;justify-content:space-between;align-items:center;
    font-size:12px;color:var(--gray);letter-spacing:.02em;
    padding:11px 0;border-bottom:1px solid var(--rule);}
  .util b{color:var(--ink);font-weight:600;}
  .mast{text-align:center;padding:26px 0 16px;cursor:pointer;
    border-bottom:4px double var(--ink);}
  .mast h1{font-family:'Nanum Myeongjo',serif;font-weight:800;
    font-size:54px;letter-spacing:-.01em;line-height:1;}
  .mast h1 .m1{color:var(--accent);}
  .mast .sub{font-size:13px;color:var(--gray);margin-top:12px;letter-spacing:.04em;}

  /* ===== 내비게이션 ===== */
  .nav{display:flex;align-items:center;gap:22px;padding:12px 0;
    border-bottom:1px solid var(--rule);flex-wrap:wrap;}
  .nav .tab{font-size:14.5px;color:var(--gray);cursor:pointer;font-weight:500;
    padding:3px 0;border-bottom:2px solid transparent;}
  .nav .tab:hover{color:var(--ink);}
  .nav .tab.on{color:var(--accent);font-weight:700;border-bottom-color:var(--accent);}
  .nav .sp{flex:1;}
  .nav .search{border:none;border-bottom:1px solid var(--rule);background:transparent;
    font-family:inherit;font-size:13.5px;padding:5px 2px;width:170px;color:var(--ink);}
  .nav .search:focus{outline:none;border-bottom-color:var(--accent);}

  main{min-height:50vh;}

  /* ===== 리드 기사 ===== */
  .lead{padding:30px 0 28px;border-bottom:1px solid var(--rule);cursor:pointer;}
  .kicker{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;}
  .lead h2{font-family:'Nanum Myeongjo',serif;font-size:38px;line-height:1.22;
    letter-spacing:-.01em;margin:10px 0 12px;}
  .lead .sum{font-size:16.5px;color:#3b3833;max-width:46em;}
  .lead .meta{font-size:12.5px;color:var(--gray);margin-top:14px;}
  .lead:hover h2{text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:4px;}

  /* ===== 기사 인덱스 ===== */
  .seclabel{font-size:12px;letter-spacing:.14em;color:var(--gray);font-weight:600;
    padding:22px 0 4px;text-transform:uppercase;}
  .row{padding:20px 0;border-bottom:1px solid var(--rule);cursor:pointer;}
  .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px;}
  .row .date{font-size:12.5px;color:var(--gray);font-variant-numeric:tabular-nums;flex:none;}
  .row h3{font-size:19px;font-weight:700;line-height:1.4;letter-spacing:-.01em;}
  .row .sum{font-size:14px;color:var(--gray);margin-top:5px;}
  .row .tags{margin-top:9px;}
  .tag{display:inline-block;font-size:11.5px;color:var(--gray);margin-right:10px;}
  .tag::before{content:"#";opacity:.6;}
  .row:hover h3{color:var(--accent);}
  .empty{text-align:center;padding:64px 20px;color:var(--gray);}

  /* ===== 기사 본문 ===== */
  .reader{max-width:680px;margin:0 auto;padding:8px 0 20px;animation:fade .2s ease;}
  @keyframes fade{from{opacity:0;}to{opacity:1;}}
  .back{display:inline-block;font-size:13px;color:var(--gray);margin:18px 0 22px;
    cursor:pointer;font-weight:500;}
  .back:hover{color:var(--accent);}
  .reader .kicker{font-size:12.5px;}
  .reader h1{font-family:'Nanum Myeongjo',serif;font-size:34px;line-height:1.28;
    letter-spacing:-.01em;margin:8px 0 12px;}
  .reader .meta{font-size:13px;color:var(--gray);padding-bottom:20px;
    border-bottom:2px solid var(--ink);margin-bottom:26px;}
  .content{font-size:16.5px;color:#262320;}
  .content .lead-p{font-size:18px;font-weight:500;color:var(--ink);margin-bottom:22px;line-height:1.7;}
  .content h3{font-family:'Nanum Myeongjo',serif;font-size:22px;margin:30px 0 12px;}
  .content p{margin-bottom:15px;}
  .content ul{margin:0 0 18px 2px;list-style:none;}
  .content li{padding:5px 0 5px 16px;position:relative;}
  .content li::before{content:"—";position:absolute;left:0;color:var(--accent);}
  .content blockquote{border-left:3px solid var(--accent);padding:6px 0 6px 20px;
    margin:24px 0;font-family:'Nanum Myeongjo',serif;font-size:19px;line-height:1.7;color:var(--ink);}
  .content a{color:var(--accent);text-decoration:underline;text-underline-offset:3px;}
  .sources{margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);
    font-size:13px;color:var(--gray);}
  .sources h4{font-size:12px;letter-spacing:.1em;color:var(--ink);margin-bottom:8px;text-transform:uppercase;}
  .sources li{padding:3px 0 3px 14px;}
  .sources li::before{color:var(--gray);}
  .share{margin:30px 0 6px;padding:16px 18px;background:var(--soft);
    font-size:13px;color:var(--gray);text-align:center;}

  /* ===== 푸터 ===== */
  footer{border-top:4px double var(--ink);margin-top:50px;}
  .foot{padding:24px 0 44px;font-size:12px;color:var(--gray);text-align:center;line-height:1.8;}
  .foot b{color:var(--ink);}

  @media (max-width:560px){
    .mast h1{font-size:38px;} .lead h2{font-size:28px;} .reader h1{font-size:26px;}
    .nav{gap:16px;} .nav .search{width:120px;}
  }
</style>
</head>
<body>

<div class="wrap">
  <div class="util">
    <span id="util-left"></span>
    <span id="util-right"></span>
  </div>
  <div class="mast" onclick="location.hash=''">
    <h1 class="serif" id="brand"></h1>
    <div class="sub" id="tagline"></div>
  </div>
</div>

<div id="app"></div>

<footer><div class="wrap"><div class="foot" id="foot"></div></div></footer>

<script src="data.js"></script>
<script>
(function(){
  var S = window.SITE;
  var catMap = {}; S.categories.forEach(function(c){ catMap[c.key]=c; });

  function fmt(d){var p=d.split('-');return p[0]+'.'+p[1]+'.'+p[2];}
  function dateK(d){var p=d.split('-');return p[0]+'년 '+(+p[1])+'월 '+(+p[2])+'일';}

  // 마스트헤드/유틸/푸터
  var b=S.meta.brand, sp=b.indexOf(' ');
  document.getElementById('brand').innerHTML = sp>0
    ? '<span class="m1">'+b.slice(0,sp)+'</span> '+b.slice(sp+1) : b;
  document.getElementById('tagline').textContent = S.meta.tagline;
  document.getElementById('util-left').innerHTML  = dateK(S.meta.updated)+' 업데이트';
  document.getElementById('util-right').innerHTML = '발행 · <b>'+S.meta.author+'</b>';
  document.getElementById('foot').innerHTML =
    '<b>'+S.meta.brand+'</b> · '+S.meta.tagline+'<br>'+
    '발행 시점의 공개 정보를 바탕으로 한 참고용 콘텐츠입니다. 재발행 시 출처를 표기해 주세요.<br>ⓒ 2026 '+S.meta.brand;

  var state={cat:'all',q:''};

  function filtered(){
    return S.articles.filter(function(a){
      if(state.cat!=='all'&&a.category!==state.cat)return false;
      if(state.q){var h=(a.title+a.summary+(a.tags||[]).join(' ')).toLowerCase();
        if(h.indexOf(state.q.toLowerCase())<0)return false;}
      return true;
    }).sort(function(x,y){return x.date<y.date?1:-1;});
  }

  function navHtml(){
    var t='<div class="tab'+(state.cat==='all'?' on':'')+'" data-cat="all">전체</div>'+
      S.categories.map(function(c){return '<div class="tab'+(state.cat===c.key?' on':'')+'" data-cat="'+c.key+'">'+c.label+'</div>';}).join('');
    return '<div class="wrap"><nav class="nav">'+t+'<span class="sp"></span>'+
      '<input class="search" id="search" placeholder="검색…" value="'+state.q.replace(/"/g,'&quot;')+'"></nav></div>';
  }

  function renderHome(){
    var arts=filtered();
    var feat=(state.cat==='all'&&!state.q)
      ? S.articles.filter(function(a){return a.featured;}).sort(function(x,y){return x.date<y.date?1:-1;})[0]:null;

    var leadHtml='';
    if(feat){var c=catMap[feat.category]||{label:''};
      leadHtml='<div class="lead" data-id="'+feat.id+'">'+
        '<div class="kicker">'+c.label+(feat.vol?'　'+feat.vol:'')+'</div>'+
        '<h2 class="serif">'+feat.title+'</h2><div class="sum">'+feat.summary+'</div>'+
        '<div class="meta">'+fmt(feat.date)+'　|　전문 읽기 →</div></div>';}

    var rows=arts.filter(function(a){return !feat||a.id!==feat.id;}).map(function(a){
      var c=catMap[a.category]||{label:a.category};
      var tags=(a.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
      return '<div class="row" data-id="'+a.id+'">'+
        '<div class="row-top"><span class="kicker">'+c.label+'</span><span class="date">'+fmt(a.date)+'</span></div>'+
        '<h3>'+a.title+'</h3><div class="sum">'+a.summary+'</div>'+
        (tags?'<div class="tags">'+tags+'</div>':'')+'</div>';
    }).join('');

    var listHtml=arts.length
      ? '<div class="seclabel">'+(state.q||state.cat!=='all'?'검색 결과 '+arts.length+'건':'기사 목록')+'</div>'+rows
      : '<div class="empty">해당하는 글이 아직 없어요.</div>';

    document.getElementById('app').innerHTML=
      navHtml()+'<div class="wrap"><main>'+leadHtml+listHtml+'</main></div>';

    var sb=document.getElementById('search');
    sb.addEventListener('input',function(){state.q=this.value;var p=this.selectionStart;renderHome();
      var n=document.getElementById('search');n.focus();try{n.setSelectionRange(p,p);}catch(e){}});
    [].forEach.call(document.querySelectorAll('.tab'),function(el){
      el.addEventListener('click',function(){state.cat=el.getAttribute('data-cat');renderHome();});});
    [].forEach.call(document.querySelectorAll('[data-id]'),function(el){
      el.addEventListener('click',function(){location.hash='#/a/'+el.getAttribute('data-id');});});
  }

  function renderArticle(id){
    var a=null;for(var i=0;i<S.articles.length;i++){if(S.articles[i].id===id)a=S.articles[i];}
    if(!a){location.hash='';return;}
    var c=catMap[a.category]||{label:a.category};
    var tags=(a.tags||[]).map(function(t){return '<span class="tag">'+t+'</span>';}).join('');
    var src=(a.sources&&a.sources.length)
      ? '<div class="sources"><h4>출처</h4><ul>'+a.sources.map(function(s){
          return '<li>'+(s.url?'<a href="'+s.url+'" target="_blank" rel="noopener">'+s.name+'</a>':s.name)+'</li>';}).join('')+'</ul></div>':'';
    document.getElementById('app').innerHTML=
      '<div class="wrap"><div class="reader">'+
        '<div class="back" onclick="location.hash=\'\'">← 목록으로</div>'+
        '<div class="kicker">'+c.label+(a.vol?'　'+a.vol:'')+'</div>'+
        '<h1 class="serif">'+a.title+'</h1>'+
        '<div class="meta">'+dateK(a.date)+' · 발행 '+S.meta.author+'</div>'+
        '<div class="content">'+a.body+'</div>'+
        (tags?'<div class="tags" style="margin-top:22px">'+tags+'</div>':'')+
        src+
        '<div class="share">이 페이지 주소를 복사해 공유하세요. 같은 링크에서 새 글이 계속 업데이트됩니다.</div>'+
      '</div></div>';
    window.scrollTo(0,0);
  }

  function route(){var m=location.hash.match(/^#\/a\/(.+)$/);if(m)renderArticle(m[1]);else renderHome();}
  window.addEventListener('hashchange',route);route();
})();
</script>
</body>
</html>
