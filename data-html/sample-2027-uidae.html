<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2027 의대 전형별 선발 비중</title>
<style>
  body{font-family:'Pretendard',-apple-system,'Malgun Gothic',sans-serif;color:#1a1a1a;
    line-height:1.7;margin:0;padding:8px 2px 24px;}
  h2{font-size:22px;margin:0 0 4px;}
  .cap{color:#6f6c66;font-size:13px;margin-bottom:18px;}
  table{border-collapse:collapse;width:100%;font-size:14.5px;margin:10px 0 6px;}
  th,td{border:1px solid #e2e0da;padding:9px 10px;text-align:center;}
  th{background:#f6f5f1;font-weight:700;}
  td.l{text-align:left;font-weight:600;}
  .bar{height:10px;background:#8f1d1d;border-radius:5px;display:inline-block;vertical-align:middle;}
  .note{color:#6f6c66;font-size:12.5px;margin-top:10px;}
  caption{caption-side:bottom;color:#6f6c66;font-size:12px;padding-top:8px;}
</style>
</head>
<body>
  <h2>2027학년도 의대 — 전형별 선발 비중</h2>
  <div class="cap">전국 의대 기준 · 일반전형과 지역선발이 사실상 5:5</div>

  <table>
    <thead>
      <tr><th>구분</th><th>비중</th><th>시각화</th></tr>
    </thead>
    <tbody>
      <tr><td class="l">일반전형</td><td>50.1%</td><td><span class="bar" style="width:50%"></span></td></tr>
      <tr><td class="l">지역선발(지역인재+지역의사)</td><td>49.9%</td><td><span class="bar" style="width:50%"></span></td></tr>
    </tbody>
    <caption>자료: 진학사 분석(2026.6.24) 집계 기준 · 교육부 확정 정원과는 집계 방식 차이 있음</caption>
  </table>

  <h2 style="margin-top:22px">비수도권 의대 — 지역선발 69.4%</h2>
  <table>
    <thead>
      <tr><th>전형</th><th>비중</th></tr>
    </thead>
    <tbody>
      <tr><td class="l">지역인재전형</td><td>50.7%</td></tr>
      <tr><td class="l">지역의사선발전형</td><td>18.7%</td></tr>
      <tr><td class="l">일반전형</td><td>30.6%</td></tr>
    </tbody>
  </table>

  <p class="note">※ 이 파일은 '진심 데이터' 사용 예시입니다. 이 HTML을 수정해 저장하면
  사이트에서 새로고침 시 자동으로 반영됩니다.</p>
</body>
</html>
