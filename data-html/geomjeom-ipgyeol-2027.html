<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>거점국립대 지역인재전형 입결 × 공공기관 연계</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700&family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --red:#c0392b; --red-light:#fdf0ef;
  --ink:#1a1a1a; --mid:#555; --faint:#aaa;
  --border:#e0e0e0; --bg:#f9f9f7; --white:#fff;
  --font-sans:'Pretendard','Apple SD Gothic Neo',sans-serif;
  --font-serif:'Noto Serif KR',serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-sans);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6}

/* 헤더 */
.masthead{background:var(--white);border-bottom:3px solid var(--red);padding:20px 0 14px}
.masthead-inner{max-width:1100px;margin:0 auto;padding:0 20px}
.masthead h1{font-family:var(--font-serif);font-size:1.5rem;font-weight:700;color:var(--red);letter-spacing:-.5px}
.masthead p{font-size:.8rem;color:var(--mid);margin-top:4px}
.byline{font-size:.75rem;color:var(--faint);margin-top:6px;border-top:1px solid var(--border);padding-top:8px}

.wrap{max-width:1100px;margin:0 auto;padding:20px}

/* 탭 */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--border)}
.tab{padding:8px 18px;font-size:.85rem;font-weight:600;color:var(--mid);cursor:pointer;border:none;background:none;border-bottom:3px solid transparent;margin-bottom:-2px;transition:.15s}
.tab.active{color:var(--red);border-bottom-color:var(--red)}

/* 대학 칩 */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.chip{padding:5px 13px;border-radius:20px;border:1px solid var(--border);background:var(--white);font-size:.8rem;cursor:pointer;transition:.15s;white-space:nowrap}
.chip:hover{border-color:var(--red);color:var(--red)}
.chip.on{background:var(--red);color:#fff;border-color:var(--red)}

/* 요약 카드 */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.card{background:var(--white);border:1px solid var(--border);border-radius:8px;padding:16px;border-top:4px solid var(--red)}
.card-univ{font-size:1rem;font-weight:700;margin-bottom:2px}
.card-region{font-size:.75rem;color:var(--mid);margin-bottom:12px}
.entry{padding:8px 0;border-bottom:1px solid var(--border)}
.entry:last-child{border-bottom:none}
.entry-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.entry-jtype{font-size:.75rem;font-weight:600;color:var(--red);background:var(--red-light);padding:2px 7px;border-radius:4px}
.entry-yr{font-size:.75rem;color:var(--mid)}
.entry-stats{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:4px;margin-top:4px}
.stat{text-align:center}
.stat-v{font-size:.95rem;font-weight:700}
.stat-l{font-size:.68rem;color:var(--mid)}
.no-data{color:var(--faint);font-size:.8rem;padding:8px 0}

/* 연계 테이블 */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.filter-row input,.filter-row select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:.82rem;font-family:inherit;min-width:140px}
.filter-row select{background:var(--white)}
.srch-btn{padding:7px 14px;background:var(--red);color:#fff;border:none;border-radius:6px;font-size:.82rem;cursor:pointer;font-family:inherit}
.cnt{font-size:.8rem;color:var(--mid);margin-left:auto}

.tbl-wrap{overflow-x:auto;border-radius:8px;border:1px solid var(--border)}
table{width:100%;border-collapse:collapse;background:var(--white)}
thead tr{background:var(--ink);color:#fff}
th{padding:9px 10px;font-size:.78rem;font-weight:600;white-space:nowrap;text-align:center}
td{padding:7px 10px;font-size:.78rem;border-bottom:1px solid var(--border);text-align:center;vertical-align:middle}
td.left{text-align:left}
tr:hover td{background:#fafafa}
.tag-gyogwa{color:#1a73e8;font-weight:600}
.tag-jonghap{color:#188038;font-weight:600}
.grade{font-weight:700}
.inst-tag{display:inline-block;font-size:.68rem;padding:1px 5px;border-radius:3px;margin-left:4px}
.inst-공공기관{background:#e8f0fe;color:#1a73e8}
.inst-산업단지{background:#fce8e6;color:#d93025}

/* 페이지네이션 */
.pager{display:flex;gap:4px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.pager button{padding:5px 10px;border:1px solid var(--border);background:var(--white);border-radius:4px;font-size:.78rem;cursor:pointer}
.pager button.on{background:var(--red);color:#fff;border-color:var(--red)}

@media(max-width:600px){
  .masthead h1{font-size:1.15rem}
  .card-grid{grid-template-columns:1fr}
  .entry-stats{grid-template-columns:1fr 1fr}
}
</style>
</head>

<div class="tbl-wrap">

</div>

let curUnivS='all', curUnivD='all';
let PAGE=1; const PER=50;
let filtered=[];

// 칩 생성
function buildChips(id, onCb){
  const el=document.getElementById(id);
  UO.forEach(u=>{
    const b=document.createElement('button');
    b.className='chip'; b.dataset.u=u;
    b.textContent=u.replace('대학교','대');
    b.onclick=()=>{el.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));b.classList.add('on');onCb(u);};
    el.appendChild(b);
  });
  el.querySelector('[data-u="all"]').onclick=()=>{
    el.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
    el.querySelector('[data-u="all"]').classList.add('on');
    onCb('all');
  };
}

// ── 요약 카드
function renderSummary(univ){
  curUnivS=univ;
  const univs = univ==='all' ? UO : [univ];
  const grid=document.getElementById('cards');
  grid.innerHTML='';
  univs.forEach(u=>{
    const entries=SUMM[u]||[];
    const div=document.createElement('div'); div.className='card';
    div.innerHTML=`<div class="card-univ">${u}</div><div class="card-region">${REG[u]||''} 권역</div>`;
    if(!entries.length){div.innerHTML+='<p class="no-data">입결 데이터 없음</p>';}
    entries.forEach(e=>{
      const jc=e.jtype.includes('교과')?'tag-gyogwa':'tag-jonghap';
      div.innerHTML+=`<div class="entry">
        <div class="entry-head">
          <span class="entry-jtype">${e.jtype.replace('학생부','').replace('(지역인재)','')}</span>
          <span class="entry-yr">${e.yr}학년도</span>
        </div>
        <div class="entry-stats">
          <div class="stat"><div class="stat-v">${e.moin??'-'}</div><div class="stat-l">모집인원</div></div>
          <div class="stat"><div class="stat-v">${e.comp??'-'}</div><div class="stat-l">경쟁률</div></div>
          <div class="stat"><div class="stat-v ${e.e50?'grade':''}">${e.e50??'-'}</div><div class="stat-l">50%컷</div></div>
          <div class="stat"><div class="stat-v ${e.e70?'grade':''}">${e.e70??'-'}</div><div class="stat-l">70%컷</div></div>
        </div>
      </div>`;
    });
    grid.appendChild(div);
  });
}

// ── 연계 테이블
function renderDetail(){
  const instQ=document.getElementById('f-inst').value.trim();
  const deptQ=document.getElementById('f-dept').value.trim();
  const typeQ=document.getElementById('f-type').value;
  const yrQ  =document.getElementById('f-yr').value;
  filtered=DET.filter(r=>{
    if(curUnivD!=='all'&&r[0]!==curUnivD) return false;
    if(instQ&&!r[2].includes(instQ)) return false;
    if(deptQ&&!r[7].includes(deptQ)) return false;
    if(typeQ&&r[5]!==typeQ) return false;
    if(yrQ&&String(r[6])!==yrQ) return false;
    return true;
  });
  PAGE=1;
  document.getElementById('det-cnt').textContent=`총 ${filtered.length.toLocaleString()}건`;
  drawPage();
}

function drawPage(){
  const start=(PAGE-1)*PER, slice=filtered.slice(start,start+PER);
  const tb=document.getElementById('det-tbody');
  tb.innerHTML=slice.map(r=>{
    const jc=r[5].includes('교과')?'tag-gyogwa':'tag-jonghap';
    const tc=r[1]==='공공기관'?'inst-공공기관':'inst-산업단지';
    return `<tr>
      <td>${r[0].replace('대학교','대')}</td>
      <td><span class="inst-tag ${tc}">${r[1]}</span></td>
      <td class="left">${r[2]}</td>
      <td class="left" style="max-width:160px;white-space:normal">${r[3]}</td>
      <td class="${jc}">${r[5].replace('학생부','').replace('(지역인재)','지역')}</td>
      <td>${r[6]??''}</td>
      <td class="left">${r[7]}</td>
      <td>${r[8]??'-'}</td>
      <td>${r[9]!=null?r[9].toFixed(2):'-'}</td>
      <td class="grade">${r[10]!=null?r[10].toFixed(2):'-'}</td>
      <td class="grade">${r[11]!=null?r[11].toFixed(2):'-'}</td>
    </tr>`;
  }).join('');
  // 페이저
  const total=Math.ceil(filtered.length/PER);
  const pg=document.getElementById('pager');
  pg.innerHTML='';
  for(let i=1;i<=Math.min(total,20);i++){
    const b=document.createElement('button');
    b.textContent=i; if(i===PAGE) b.classList.add('on');
    b.onclick=(()=>{const p=i;return()=>{PAGE=p;drawPage();window.scrollTo(0,0);};} )();
    pg.appendChild(b);
  }
}

// 탭 전환
document.querySelectorAll('.tab').forEach(t=>{
  t.onclick=()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('tab-summary').style.display=t.dataset.tab==='summary'?'':'none';
    document.getElementById('tab-detail').style.display=t.dataset.tab==='detail'?'':'none';
  };
});

// 초기화
buildChips('chips-s', u=>renderSummary(u));
buildChips('chips-d', u=>{curUnivD=u;renderDetail();});
renderSummary('all');
renderDetail();

// 엔터 검색
['f-inst','f-dept'].forEach(id=>document.getElementById(id).addEventListener('keydown',e=>{if(e.key==='Enter')renderDetail();}));
