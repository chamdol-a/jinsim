<html lang="ko"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>2027 의·치·한·약·수 수시 전형 탐색</title><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"/><style>
:root{--ink:#1a1a1a;--paper:#ffffff;--soft:#f6f5f1;--rule:#e2e0da;--accent:#8f1d1d;--gray:#6f6c66;

*{box-sizing:border-box}
html{background:var(--paper)}
body{margin:0;font-family:'Pretendard',-apple-system,'Noto Sans KR','Malgun Gothic',sans-serif;color:var(--ink);background:var(--paper)}
.top{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.97);border-bottom:2px solid var(--ink);padding:14px 18px 10px}
h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.4px}
h1 .num{color:var(--accent);font-size:12px;font-weight:700;margin-left:8px}
.sub{margin:3px 0 10px;font-size:11.5px;color:var(--gray);line-height:1.55}
.frow{display:flex;align-items:flex-start;gap:8px;flex-wrap:wrap;margin-bottom:7px}
.flbl{font-size:10.5px;font-weight:800;color:var(--gray);min-width:34px;padding-top:6px}
.chips{display:flex;gap:5px;flex-wrap:wrap;flex:1}
.chip{padding:5px 12px;border:1px solid var(--rule);background:#fff;border-radius:15px;cursor:pointer;font-size:12px;font-weight:600;color:var(--ink);user-select:none}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.srch{padding:7px 12px;border:1.5px solid var(--rule);border-radius:8px;font-size:13px;outline:none;min-width:210px;font-family:inherit}
.srch:focus{border-color:var(--accent)}
.cnt{font-size:11px;color:var(--gray);align-self:center}
.pbtn{padding:6px 12px;border:1px solid var(--rule);background:var(--soft);border-radius:8px;cursor:pointer;font-size:11px;font-weight:700;color:var(--ink);margin-left:auto;font-family:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:12px 14px 60px}
.twrap{overflow-x:auto;border:1px solid var(--rule);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:12px}
thead th{background:var(--soft);font-size:11px;padding:7px 8px;text-align:left;border-bottom:1.5px solid var(--rule);white-space:nowrap;position:sticky;top:0;cursor:pointer}
thead th.n{text-align:right}
thead th .ar{color:var(--accent);font-size:9px}
td{padding:5.5px 8px;border-bottom:1px solid var(--soft);vertical-align:top}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
td.u{font-weight:700;white-space:nowrap}
td.g{color:var(--gray);font-size:11px;white-space:nowrap}
tr:hover td{background:#faf9f6}
.more{display:block;margin:12px auto;padding:8px 26px;border:1.5px solid var(--accent);background:#fff;color:var(--accent);border-radius:20px;cursor:pointer;font-size:12.5px;font-weight:700;font-family:inherit}
.more:hover{background:var(--accent);color:#fff}
.src{margin-top:18px;padding-top:10px;border-top:1px solid var(--rule);font-size:10.5px;color:var(--gray);line-height:1.6}
.badge{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10px;font-weight:700;vertical-align:middle}
.empty{text-align:center;color:var(--gray);padding:46px 0;font-weight:600}
@media print{.top{position:static}.pbtn,.more{display:none}}
@media(max-width:640px){.top{padding:10px 10px 8px}h1{font-size:15.5px}.chips{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:3px}.chip{flex-shrink:0}.srch{min-width:140px;flex:1}}

    h+="<tr><td><span class=badge style='background:"+(CATCOL[r.cat]||"#555")+"22;color:"+(CATCOL[r.cat]||"#555")+"'>"+esc(r.cat)+"</span></td>"+
     "<td class=u>"+esc(r.univ)+"</td><td class=g>"+esc(r.type)+"</td><td>"+esc(r.name)+(r.ad?" <span class=badge style='background:#f0fdf4;color:#166534'>지역인재</span>":"")+"</td>"+
     "<td class=n><b>"+esc(r.n27||"—")+"</b>"+ds+"</td><td class=n>"+esc(r.n26||"—")+"</td>"+
     "<td style='font-size:11px'>"+minTxt(r)+"</td><td class=g>"+esc(r.stage||"—")+"</td>"+
     "<td class=n>"+esc(r.rate26||"—")+"</td><td class=n>"+esc(r.rate25||"—")+"</td></tr>";
  });
  document.getElementById("tb").innerHTML=h||"<tr><td colspan=10 class=empty>조건에 맞는 행이 없습니다</td></tr>";
}
